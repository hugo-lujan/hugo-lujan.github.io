<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maximus Trips | Linktree</title>
    <!-- Favicon -->
    <link rel="icon" href="hugosmall.jpg" type="image/x-icon" />
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css">
    <!-- Core theme CSS -->
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <!-- Parallax Pixel Background Animation -->
    <section class="animated-background">
      <div id="stars1"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
    </section>
    <!-- End of Parallax Pixel Background Animation -->

    <a id="profilePicture" href="#popup">
      <img src="hugosmall.jpg" alt="Profile Picture">
    </a>

    <div class="overlay" id="popup">
      <div class="popup">
        <div class="popup-photo">
          <a href="https://www.evotravelagent.com/maximustrips" target="_blank">
            <img src="hugosmall.jpg" alt="Profile Picture">
          </a>
        </div>
        <div class="popup-quote">
          Dream Trips.
        </div>
        <a class="popup-close" onclick="history.back()">&times;</a>
      </div>
    </div>

    <div id="userName">
      @maximustrips
    </div>

    <div id="links">
      <a class="link" href="https://www.linkedin.com/in/hugo1lujan/" target="_blank">
        <i class="fab fa-linkedin">&nbsp;</i>Linkedin
      </a>
      <a class="link" href="https://www.facebook.com/profile.php?id=61567331620533&sk=about" target="_blank">
        <i class="fab fa-facebook">&nbsp;</i>Facebook
      </a>
      <a class="link" href="https://www.evotravelagent.com/maximustrips" target="_blank">
        <i class="fab fa-fighter-jet">&nbsp;</i>Maximus Trips
      </a>
    </div>

    <div id="hashtag">
      #BeHappy❤
    </div>
  </body>
</html>
